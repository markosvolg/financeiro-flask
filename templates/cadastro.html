<!DOCTYPE html>
<html>
<head>
    <title>Cadastro</title>
</head>
<body>

<h2>Criar Conta</h2>

<form method="POST">

    <input
        type="text"
        name="usuario"
        placeholder="Usuário"
        required>

    <input
        type="email"
        name="email"
        placeholder="Email"
        required>

    <input
        type="password"
        name="senha"
        placeholder="Senha"
        required>

    <button type="submit">
        Cadastrar
    </button>

</form>

<a href="/login">
    Voltar ao Login
</a>

</body>
</html>
