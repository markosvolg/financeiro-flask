<!DOCTYPE html>
<html>
<head>
    <title>Cadastro</title>
    <!--<link rel="stylesheet" href="/static/style.css">-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>

<div class="login-container">

    <h2>Criar Conta</h2>

<form method="POST">

    <input
        type="text"
        name="usuario"
        placeholder="Usuário"
        required>

    <input
        type="email"
        name="email"
        placeholder="Email"
        required>

    <input
        type="password"
        name="senha"
        placeholder="Senha"
        required>

    <button type="submit">
        Cadastrar
    </button>

</form>

<a href="/login">
    Já possui conta?
</a>

</div>

</body>
</html>
