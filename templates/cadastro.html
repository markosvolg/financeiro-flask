<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Financeiro</title>

    <!-- AdminLTE v4 e FontAwesome -->
    <link rel="stylesheet" href="{{ url_for('static', filename='adminlte/dist/css/adminlte.min.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="register-page bg-body-secondary" style="min-height: 100vh; display: flex; align-items: center; justify-content: center;">

    <div class="register-box" style="width: 400px;">
        <div class="register-logo mb-4">
            <a href="/" class="text-decoration-none">
                <i class="fas fa-wallet text-success me-2"></i>
                <b>Financeiro</b>
            </a>
        </div>

        <div class="card card-outline card-success shadow">
            <div class="card-header text-center">
                <h3 class="card-title">Criar Nova Conta</h3>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="input-group mb-3">
                        <input type="text" name="usuario" class="form-control" placeholder="Nome de Usuário" required>
                        <div class="input-group-append">
                            <div class="input-group-text">
                                <span class="fas fa-user"></span>
                            </div>
                        </div>
                    </div>

                    <div class="input-group mb-3">
                        <input type="email" name="email" class="form-control" placeholder="E-mail" required>
                        <div class="input-group-append">
                            <div class="input-group-text">
                                <span class="fas fa-envelope"></span>
                            </div>
                        </div>
                    </div>

                    <div class="input-group mb-3">
                        <input type="password" name="senha" class="form-control" placeholder="Senha" required>
                        <div class="input-group-append">
                            <div class="input-group-text">
                                <span class="fas fa-lock"></span>
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-success btn-block w-100">
                        <i class="fas fa-user-plus me-2"></i> Cadastrar
                    </button>
                </form>

                <p class="mt-4 mb-0 text-center">
                    <a href="/login" class="text-decoration-none">Já possui uma conta? Faça login</a>
                </p>
            </div>
        </div>
    </div>

    <!-- Scripts do AdminLTE -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="{{ url_for('static', filename='adminlte/dist/js/adminlte.min.js') }}"></script>
</body>
</html>
