{% extends "base.html" %}

{% block titulo %}Dashboard{% endblock %}

{% block conteudo %}
<div class="row">
    <div class="col-12 mb-4">
        <h2><i class="fas fa-chart-pie text-primary"></i> Visão Geral</h2>
    </div>
</div>

<!-- Cards de Resumo (Small Boxes) -->
<div class="row">
    <!-- Receitas -->
    <div class="col-lg-4 col-6">
        <div class="small-box text-bg-success shadow">
            <div class="inner">
                <h3>R$ 15.000</h3> <!-- Aqui você pode colocar a variável Jinja ex: {{ total_receitas }} -->
                <p>Receitas</p>
            </div>
            <i class="small-box-icon fas fa-arrow-up"></i>
            <a href="/receitas" class="small-box-footer link-light link-underline-opacity-0 link-underline-opacity-50-hover">
                Ver detalhes <i class="fas fa-arrow-circle-right"></i>
            </a>
        </div>
    </div>

    <!-- Despesas -->
    <div class="col-lg-4 col-6">
        <div class="small-box text-bg-danger shadow">
            <div class="inner">
                <h3>R$ 400</h3> <!-- {{ total_despesas }} -->
                <p>Despesas</p>
            </div>
            <i class="small-box-icon fas fa-arrow-down"></i>
            <a href="/despesas" class="small-box-footer link-light link-underline-opacity-0 link-underline-opacity-50-hover">
                Ver detalhes <i class="fas fa-arrow-circle-right"></i>
            </a>
        </div>
    </div>

    <!-- Saldo -->
    <div class="col-lg-4 col-12">
        <div class="small-box text-bg-primary shadow">
            <div class="inner">
                <h3>R$ 14.600</h3> <!-- {{ saldo }} -->
                <p>Saldo Atual</p>
            </div>
            <i class="small-box-icon fas fa-wallet"></i>
            <a href="#" class="small-box-footer link-light link-underline-opacity-0 link-underline-opacity-50-hover">
                Mais informações <i class="fas fa-arrow-circle-right"></i>
            </a>
        </div>
    </div>
</div>

<!-- Gráficos -->
<div class="row mt-4">
    <!-- Gráfico de Pizza -->
    <div class="col-md-6">
        <div class="card card-primary card-outline shadow">
            <div class="card-header">
                <h3 class="card-title"><i class="fas fa-chart-pie me-2"></i> Receitas x Despesas</h3>
            </div>
            <div class="card-body">
                <canvas id="graficoPizza" style="min-height: 250px; height: 250px; max-height: 250px; max-width: 100%;"></canvas>
            </div>
        </div>
    </div>

    <!-- Gráfico de Linha -->
    <div class="col-md-6">
        <div class="card card-success card-outline shadow">
            <div class="card-header">
                <h3 class="card-title"><i class="fas fa-chart-line me-2"></i> Evolução Mensal</h3>
            </div>
            <div class="card-body">
                <canvas id="graficoLinha" style="min-height: 250px; height: 250px; max-height: 250px; max-width: 100%;"></canvas>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<!-- Exemplo de como renderizar os gráficos caso os dados venham do backend -->
<script>
    // Aqui você precisará adaptar com os dados reais que o seu backend envia
    // Estou usando dados estáticos apenas para o visual não ficar vazio
    
    // Gráfico de Pizza
    const ctxPizza = document.getElementById('graficoPizza').getContext('2d');
    new Chart(ctxPizza, {
        type: 'doughnut',
        data: {
            labels: ['Receitas', 'Despesas'],
            datasets: [{
                data: [15000, 400], // Substitua por variáveis do Jinja ex: [{{ resumo[0][1] }}, {{ resumo[1][1] }}]
                backgroundColor: ['#198754', '#dc3545'],
                borderWidth: 0
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { position: 'top', labels: { color: '#fff' } }
            }
        }
    });

    // Gráfico de Linha
    const ctxLinha = document.getElementById('graficoLinha').getContext('2d');
    new Chart(ctxLinha, {
        type: 'line',
        data: {
            labels: ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun'],
            datasets: [
                {
                    label: 'Receitas',
                    data: [5000, 6000, 5500, 7000, 8000, 15000],
                    borderColor: '#198754',
                    backgroundColor: 'rgba(25, 135, 84, 0.2)',
                    fill: true,
                    tension: 0.4
                },
                {
                    label: 'Despesas',
                    data: [3000, 2500, 4000, 3500, 500, 400],
                    borderColor: '#dc3545',
                    backgroundColor: 'rgba(220, 53, 69, 0.2)',
                    fill: true,
                    tension: 0.4
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { labels: { color: '#fff' } }
            },
            scales: {
                x: { ticks: { color: '#aaa' }, grid: { color: 'rgba(255,255,255,0.1)' } },
                y: { ticks: { color: '#aaa' }, grid: { color: 'rgba(255,255,255,0.1)' } }
            }
        }
    });
</script>
{% endblock %}
