<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark"> <!-- Ativa o modo escuro nativo do v4 -->
<head>
    <meta charset="UTF-8">
    <title>{% block titulo %}{% endblock %}</title>

    <!-- AdminLTE v4 (Bootstrap 5) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='adminlte/dist/css/adminlte.min.css') }}">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- DataTables CSS (Bootstrap 5) -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css">

    <!-- Chart.js e jQuery -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>  
    
    <!-- CSS Customizado (Se tiver, descomente depois de testar) -->
    <!-- <link rel="stylesheet" href="/static/styleadminlte.css"> -->
</head>

<body class="layout-fixed sidebar-expand-lg bg-body-tertiary">
    <div class="app-wrapper">
        
        <!-- Sidebar (Estrutura correta do AdminLTE v4) -->
        <aside class="app-sidebar bg-body-secondary shadow" data-bs-theme="dark">
            
            <!-- Logo -->
            <div class="sidebar-brand">
                <a href="/dashboard" class="brand-link">
                    <i class="fas fa-wallet brand-image opacity-75 shadow ms-2 me-2"></i>
                    <span class="brand-text fw-light">Financeiro</span>
                </a>
            </div>

            <!-- Menu -->
            <div class="sidebar-wrapper">
                <nav class="mt-2">
                    <ul class="nav sidebar-menu flex-column" data-lte-toggle="treeview" role="menu" data-accordion="false">
                        
                        <li class="nav-item">
                            <a href="/dashboard" class="nav-link {% if request.path.startswith('/dashboard') %}active{% endif %}">
                                <i class="nav-icon fas fa-chart-line"></i>
                                <p>Dashboard</p>
                            </a>
                        </li>
                        
                        <li class="nav-item">
                            <a href="/receitas" class="nav-link {% if request.path.startswith('/receitas') %}active{% endif %}">
                                <i class="nav-icon fas fa-money-bill-wave"></i>
                                <p>Receitas</p>
                            </a>
                        </li>
                        
                        <li class="nav-item">
                            <a href="/despesas" class="nav-link {% if request.path.startswith('/despesas') %}active{% endif %}">
                                <i class="nav-icon fas fa-credit-card"></i>
                                <p>Despesas</p>
                            </a>
                        </li>
                        
                        <li class="nav-item">
                            <a href="/usuarios" class="nav-link {% if request.path.startswith('/usuarios') %}active{% endif %}">
                                <i class="nav-icon fas fa-user"></i>
                                <p>Usuários</p>
                            </a>
                        </li>
                        
                        <li class="nav-item mt-auto"> 
                            <a href="/logout" class="nav-link text-danger">
                                <i class="nav-icon fas fa-sign-out-alt"></i>
                                <p>Sair</p>
                            </a>
                        </li>

                    </ul>
                </nav>
            </div>
        </aside>

        <!-- Conteúdo Principal -->
        <main class="app-main">
            <!-- Aqui é onde o seu conteúdo (despesas.html, receitas.html) será injetado -->
            <div class="app-content">
                <div class="container-fluid pt-4">
                    {% block conteudo %}
                    {% endblock %}
                </div>
            </div>
        </main>

    </div>

    <!-- Scripts Globais do AdminLTE v4 -->
    <script src="{{ url_for('static', filename='adminlte/dist/js/adminlte.min.js') }}"></script>
    
    <!-- DataTables JS (Bootstrap 5) -->
    <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>

    {% block scripts %}
    {% endblock %}
</body>
</html>
