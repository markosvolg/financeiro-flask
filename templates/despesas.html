{% extends "base.html" %}

{% block titulo %}Despesas{% endblock %}

{% block conteudo %}
<div class="row mb-4">
    <div class="col-12">
        <h2><i class="fas fa-credit-card text-danger"></i> Despesas</h2>
    </div>
</div>

<div class="row">
    <div class="col-md-12">
        <div class="card card-danger card-outline shadow">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h3 class="card-title">Gerenciar Despesas</h3>
                <button class="btn btn-danger btn-sm" onclick="abrirModalCadastro()">
                    <i class="fas fa-plus"></i> Nova Despesa
                </button>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table id="tabela-despesas" class="table table-hover w-100">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Descrição</th>
                                <th>Valor</th>
                                <th>Data</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Toast de Notificação (Sucesso) -->
<div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="toastSucesso" class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body">
                <i class="fas fa-check-circle me-2"></i> Operação realizada com sucesso!
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
    </div>
</div>

<!-- MODAL CADASTRO/EDIÇÃO -->
<div class="modal fade" id="modalDespesa" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content bg-dark text-light">
            <div class="modal-header border-secondary">
                <h5 class="modal-title" id="tituloModal">Nova Despesa</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="form-despesa">
                    <input type="hidden" id="idDespesa">
                    <div class="mb-3">
                        <label>Descrição</label>
                        <input type="text" class="form-control" id="descricao" required>
                    </div>
                    <div class="mb-3">
                        <label>Valor</label>
                        <input type="number" step="0.01" class="form-control" id="valor" required>
                    </div>
                    <div class="mb-3">
                        <label>Data</label>
                        <input type="date" class="form-control" id="data" required>
                    </div>
                    <button type="submit" class="btn btn-danger w-100">Salvar</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const formatarMoeda = (valor) => Number(valor).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    let modal = null;
    let toast = null;
    let dataTable = null;

    document.addEventListener("DOMContentLoaded", () => {
        // Inicializa Modal e Toast
        modal = new bootstrap.Modal(document.getElementById('modalDespesa'));
        toast = new bootstrap.Toast(document.getElementById('toastSucesso'), { delay: 3000 });

        // Inicializa a tabela vazia no primeiro carregamento
        dataTable = $('#tabela-despesas').DataTable({ 
            "language": { "url": "https://cdn.datatables.net/plug-ins/1.13.8/i18n/pt-BR.json" },
            "order": [], // Desabilita ordenação automática
            "pageLength": 10
        });

        carregarDespesas();

        // A MÁGICA ACONTECE AQUI: Só recarrega a tabela depois que o modal sumir da tela!
        document.getElementById('modalDespesa').addEventListener('hidden.bs.modal', function () {
            carregarDespesas();
        });
    });

    async function carregarDespesas() {
        try {
            const res = await fetch('/api/movimentacoes', { cache: 'no-store' });
            if (res.redirected) { window.location.href = res.url; return; }
            if (!res.ok) throw new Error("Erro na API");

            const dados = await res.json();
            
            // Filtra e ordena as despesas (maior ID primeiro)
            const despesas = dados.filter(d => d.tipo === 'despesa').sort((a, b) => b.id - a.id);

            // Limpa a tabela atual sem destruí-la
            dataTable.clear();

            // Adiciona as linhas na tabela
            despesas.forEach(item => {
                dataTable.row.add([
                    item.id,
                    item.descricao,
                    `<span class="text-danger fw-bold">${formatarMoeda(item.valor)}</span>`,
                    item.data,
                    `<button class="btn btn-sm btn-primary btn-editar" data-id="${item.id}" data-descricao="${item.descricao}" data-valor="${item.valor}" data-data="${item.data}"><i class="fas fa-edit"></i></button>
                     <button class="btn btn-sm btn-danger btn-excluir" data-id="${item.id}"><i class="fas fa-trash"></i></button>`
                ]);
            });

            // Desenha a tabela atualizada
            dataTable.draw();

        } catch (error) {
            console.error("Erro no carregamento:", error);
        }
    }

    // Event Delegation (Escuta os cliques na tabela)
    document.querySelector('#tabela-despesas tbody').addEventListener('click', (e) => {
        const btnEditar = e.target.closest('.btn-editar');
        if (btnEditar) {
            editar(btnEditar.dataset.id, btnEditar.dataset.descricao, btnEditar.dataset.valor, btnEditar.dataset.data);
        }
        const btnExcluir = e.target.closest('.btn-excluir');
        if (btnExcluir) {
            excluir(btnExcluir.dataset.id);
        }
    });

    function abrirModalCadastro() {
        document.getElementById('form-despesa').reset();
        document.getElementById('idDespesa').value = '';
        document.getElementById('tituloModal').innerText = 'Nova Despesa';
        modal.show();
    }

    function editar(id, descricao, valor, data) {
        document.getElementById('idDespesa').value = id;
        document.getElementById('descricao').value = descricao;
        document.getElementById('valor').value = valor;
        document.getElementById('data').value = data;
        document.getElementById('tituloModal').innerText = 'Editar Despesa';
        modal.show();
    }

    async function excluir(id) {
        if(confirm("Tem certeza que deseja excluir esta despesa?")) {
            await fetch(`/api/movimentacoes/${id}`, { method: 'DELETE' });
            await carregarDespesas();
            toast.show();
        }
    }

    document.getElementById('form-despesa').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('idDespesa').value;
        
        const payload = {
            descricao: document.getElementById('descricao').value,
            valor: parseFloat(document.getElementById('valor').value),
            data: document.getElementById('data').value,
            tipo: 'despesa'
        };

        const url = id ? `/api/movimentacoes/${id}` : '/api/movimentacoes';
        const method = id ? 'PUT' : 'POST';

        try {
            const response = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                document.getElementById('form-despesa').reset();
                // Apenas esconde o modal. O evento 'hidden.bs.modal' vai cuidar de atualizar a tabela!
                modal.hide(); 
                toast.show();
            }
        } catch (error) {
            console.error("Erro ao salvar:", error);
        }
    });
</script>
{% endblock %}
