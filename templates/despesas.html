{% extends "base.html" %}

{% block titulo %}Despesas{% endblock %}

{% block conteudo %}
<div class="row mb-4">
    <div class="col-12">
        <h2><i class="fas fa-credit-card text-danger"></i> Despesas</h2>
    </div>
</div>

<div class="row">
    <!-- Card de Cadastro -->
    <div class="col-md-12">
        <div class="card card-danger card-outline shadow">
            <div class="card-header">
                <h3 class="card-title">Cadastrar Nova Despesa</h3>
            </div>
            <div class="card-body">
                <form id="form-despesa" class="row g-3">
                    <div class="col-md-5">
                        <input type="text" class="form-control" id="descricao" placeholder="Descrição (ex: Conta de Luz)" required>
                    </div>
                    <div class="col-md-3">
                        <input type="number" step="0.01" class="form-control" id="valor" placeholder="Valor (ex: 150.00)" required>
                    </div>
                    <div class="col-md-2">
                        <input type="date" class="form-control" id="data" required>
                    </div>
                    <div class="col-md-2 d-grid">
                        <button type="submit" class="btn btn-danger"><i class="fas fa-plus"></i> Adicionar</button>
                    </div>
                </form>
                <div id="mensagem" class="mt-3 text-success fw-bold"></div>
            </div>
        </div>
    </div>

    <!-- Card da Tabela -->
    <div class="col-md-12">
        <div class="card card-danger card-outline shadow">
            <div class="card-header">
                <h3 class="card-title">Histórico de Despesas</h3>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table id="tabela-despesas" class="table table-hover w-100">
                        <thead>
                            <tr>
                                <th>Descrição</th>
                                <th>Valor</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Preenchido via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const formatarMoeda = (valor) => {
        return Number(valor).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    };

    let dataTableDespesas = null;

    async function carregarDespesas() {
        try {
            const response = await fetch('/movimentacoes');
            if(response.redirected) { window.location.href = "/login"; return; }

            const dados = await response.json();
            const tbody = document.querySelector('#tabela-despesas tbody');
            tbody.innerHTML = '';
            
            const despesas = dados.filter(item => item.tipo === 'despesa');

            despesas.forEach(item => {
                tbody.innerHTML += `
                    <tr>
                        <td>${item.descricao}</td>
                        <td class="text-danger fw-bold">${formatarMoeda(item.valor)}</td>
                    </tr>
                `;
            });

            // Inicializa o DataTables
            if ($.fn.DataTable.isDataTable('#tabela-despesas')) {
                $('#tabela-despesas').DataTable().destroy();
            }
            
            dataTableDespesas = $('#tabela-despesas').DataTable({
                "language": { "url": "https://cdn.datatables.net/plug-ins/1.13.8/i18n/pt-BR.json" },
                "pageLength": 10
            });

        } catch (error) {
            console.error("Erro ao carregar despesas:", error);
        }
    }

    document.getElementById('form-despesa').addEventListener('submit', async (e) => {
        e.preventDefault();
        const descricao = document.getElementById('descricao').value;
        const valor = parseFloat(document.getElementById('valor').value);
        const data = document.getElementById('data').value;
        const msgDiv = document.getElementById('mensagem');

        try {
            const response = await fetch('/despesa', { 
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ descricao, valor, data })
            });

            if (response.ok) {
                msgDiv.innerText = "Despesa cadastrada com sucesso!";
                document.getElementById('form-despesa').reset();
                carregarDespesas(); 
                setTimeout(() => msgDiv.innerText = '', 3000);
            }
        } catch (error) {
            console.error("Erro no envio:", error);
        }
    });

    document.addEventListener("DOMContentLoaded", carregarDespesas);
</script>
{% endblock %}
