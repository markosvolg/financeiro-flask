{% extends "base.html" %}

{% block titulo %}Receitas{% endblock %}

{% block conteudo %}
<div class="row">
    <div class="col-12">
        <h2 class="mb-4"><i class="fas fa-money-bill-wave text-success"></i> Receitas</h2>
    </div>
</div>

<div class="row">
    <!-- Card de Cadastro -->
    <div class="col-md-12">
        <div class="card card-success card-outline">
            <div class="card-header">
                <h3 class="card-title">Cadastrar Nova Receita</h3>
            </div>
            <div class="card-body">
                <form id="form-receita" class="row g-3">
                    <div class="col-md-5">
                        <input type="text" class="form-control" id="descricao" placeholder="Descrição (ex: Salário)" required>
                    </div>
                    <div class="col-md-3">
                        <input type="number" step="0.01" class="form-control" id="valor" placeholder="Valor (ex: 1500.00)" required>
                    </div>
                    <div class="col-md-2">
                        <input type="date" class="form-control" id="data" required>
                    </div>
                    <div class="col-md-2 d-grid">
                        <button type="submit" class="btn btn-success"><i class="fas fa-plus"></i> Adicionar</button>
                    </div>
                </form>
                <div id="mensagem" class="mt-3 text-success fw-bold"></div>
            </div>
        </div>
    </div>

    <!-- Card da Tabela -->
    <div class="col-md-12">
        <div class="card card-success card-outline">
            <div class="card-header">
                <h3 class="card-title">Histórico de Receitas</h3>
            </div>
            <div class="card-body table-responsive">
                <table id="tabela-receitas" class="table table-dark table-hover table-striped">
                    <thead>
                        <tr>
                            <th>Descrição</th>
                            <th>Valor</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Preenchido via JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    // Formata valores para Real
    const formatarMoeda = (valor) => {
        return Number(valor).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    };

    let dataTableReceitas = null;

    async function carregarReceitas() {
        try {
            const response = await fetch('/movimentacoes');
            if(response.redirected) { window.location.href = "/login"; return; }
            
            const dados = await response.json();
            const tbody = document.querySelector('#tabela-receitas tbody');
            tbody.innerHTML = '';
            
            const receitas = dados.filter(item => item.tipo === 'receita');

            receitas.forEach(item => {
                tbody.innerHTML += `
                    <tr>
                        <td>${item.descricao}</td>
                        <td class="text-success fw-bold">${formatarMoeda(item.valor)}</td>
                    </tr>
                `;
            });

            // Inicializa o DataTables (se ainda não foi inicializado)
            if (dataTableReceitas) {
                dataTableReceitas.destroy();
            }
            dataTableReceitas = $('#tabela-receitas').DataTable({
                "language": { "url": "https://cdn.datatables.net/plug-ins/1.13.8/i18n/pt-BR.json" }
            });

        } catch (error) {
            console.error("Erro ao carregar receitas:", error);
        }
    }

    document.getElementById('form-receita').addEventListener('submit', async (e) => {
        e.preventDefault();
        const descricao = document.getElementById('descricao').value;
        const valor = parseFloat(document.getElementById('valor').value);
        const data = document.getElementById('data').value;
        const msgDiv = document.getElementById('mensagem');

        try {
            const response = await fetch('/receitas', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ descricao, valor, data })
            });

            if (response.ok) {
                msgDiv.innerText = "Receita cadastrada com sucesso!";
                document.getElementById('form-receita').reset();
                carregarReceitas(); 
                setTimeout(() => msgDiv.innerText = '', 3000);
            }
        } catch (error) {
            console.error("Erro no envio:", error);
        }
    });

    carregarReceitas();
</script>
{% endblock %}
