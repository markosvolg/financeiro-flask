<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Financeiro</title>

    <!-- AdminLTE v4 e FontAwesome -->
    <link rel="stylesheet" href="{{ url_for('static', filename='adminlte/dist/css/adminlte.min.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="login-page bg-body-secondary">

      <div class="login-box">
        <div class="login-logo mb-4">
            <a href="/" class="text-decoration-none">
                <i class="fas fa-wallet text-primary me-2"></i>
                <b>Financeiro</b>
            </a>
        </div>

        <div class="card card-outline card-primary shadow">
            <div class="card-header text-center">
                <h3 class="card-title">Acesse sua conta</h3>
            </div>
            <div class="card-body">
                   <!-- Exibir mensagem de erro se houver (opcional, se usar flash no Flask) -->
                <!-- <p class="login-box-msg text-danger">Credenciais inválidas</p> -->

    

    <form method="POST">

                    <div class="input-group mb-3">
                        <input type="email" name="email" class="form-control" placeholder="E-mail" required>
                        <div class="input-group-append">
                            <div class="input-group-text">
                                <span class="fas fa-envelope"></span>
                            </div>
                        </div>
                    </div>

                        <div class="input-group mb-3">
                        <input type="password" name="senha" class="form-control" placeholder="Senha" required>
                        <div class="input-group-append">
                            <div class="input-group-text">
                                <span class="fas fa-lock"></span>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-12">
                            <button type="submit" class="btn btn-primary btn-block w-100">
                                <i class="fas fa-sign-in-alt me-2"></i> Entrar
                            </button>
                        </div>
                    </div>
                </form>

                <p class="mt-4 mb-0 text-center">
                    <a href="/cadastro" class="text-decoration-none">Não tem uma conta? Cadastre-se</a>
                </p>
            </div>
        </div>
    </div>
       <!-- Scripts do AdminLTE -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="{{ url_for('static', filename='adminlte/dist/js/adminlte.min.js') }}"></script>

</body>
</html>
