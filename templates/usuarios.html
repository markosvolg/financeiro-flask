{% extends "base.html" %}

{% block titulo %}Usuários{% endblock %}

{% block conteudo %}
<div class="row">
    <div class="col-12">
        <h2 class="mb-4"><i class="fas fa-users text-primary"></i> Usuários Cadastrados</h2>
    </div>
</div>

<div class="row">
    <div class="col-md-12">
        <div class="card card-primary card-outline">
            <div class="card-header">
                <h3 class="card-title">Lista de Usuários</h3>
            </div>
            <div class="card-body table-responsive">
                <table id="tabela-usuarios" class="table table-dark table-hover table-striped">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome de Usuário</th>
                            <th>E-mail</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Preenchido via JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    let dataTableUsuarios = null;

    async function carregarUsuarios() {
        try {
            const response = await fetch('/api/usuarios');
            if (response.redirected) {
                window.location.href = response.url;
                return;
            }

            const dados = await response.json();
            const tbody = document.querySelector('#tabela-usuarios tbody');
            tbody.innerHTML = '';

            dados.forEach(user => {
                tbody.innerHTML += `
                    <tr>
                        <td>${user.id}</td>
                        <td>${user.usuario}</td>
                        <td>${user.email}</td>
                    </tr>
                `;
            });

            if (dataTableUsuarios) {
                dataTableUsuarios.destroy();
            }
            dataTableUsuarios = $('#tabela-usuarios').DataTable({
                "language": { "url": "https://cdn.datatables.net/plug-ins/1.13.8/i18n/pt-BR.json" }
            });

        } catch (error) {
            console.error("Erro ao carregar usuários:", error);
        }
    }

    carregarUsuarios();
</script>
{% endblock %}
